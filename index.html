<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a navy app bar over one tablet-width column. Tally marks are the brand motif.
   Counting rows are built for thumbs: 56px targets, red stripe + pill for anything low. */
:root {
  --bg: #f0f1f4;
  --surface: #ffffff;
  --surface-2: #e7e9ee;
  --ink: #161a24;
  --muted: #596074;
  --line: #d4d8e0;
  --brand: #1c2742;          /* app bar and sign-in panel */
  --brand-ink: #f4f6fb;
  --brand-muted: #b3bdd6;
  --accent: #f5a524;         /* tally amber */
  --accent-ink: #1c1400;
  --low: #c2271d;
  --low-bg: #fde8e6;
  --ok: #1c774a;
  --ok-bg: #e1f3e9;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f121a; --surface: #181d29; --surface-2: #232a3a; --ink: #eceef5; --muted: #9ba4ba; --line: #2d3548;
    --brand: #0b0f18; --brand-ink: #f4f6fb; --brand-muted: #9ba4ba;
    --accent: #f5a524; --accent-ink: #1c1400;
    --low: #ff867c; --low-bg: #46201d; --ok: #70d49c; --ok-bg: #163425;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f121a; --surface: #181d29; --surface-2: #232a3a; --ink: #eceef5; --muted: #9ba4ba; --line: #2d3548;
  --brand: #0b0f18; --brand-ink: #f4f6fb; --brand-muted: #9ba4ba;
  --accent: #f5a524; --accent-ink: #1c1400;
  --low: #ff867c; --low-bg: #46201d; --ok: #70d49c; --ok-bg: #163425;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.45; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.page { max-width: 1040px; margin: 0 auto; padding: 20px 16px 56px; display: flex; flex-direction: column; gap: 20px; }

/* ---------- Sign-in ---------- */
.signin { display: flex; flex-wrap: wrap; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.signin-brand { flex: 1 1 320px; background: var(--brand); color: var(--brand-ink); padding: 32px 28px; display: flex; flex-direction: column; gap: 18px; justify-content: space-between; }
.signin-brand h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; }
.signin-brand p { color: var(--brand-muted); max-width: 34ch; }
.tally { display: flex; gap: 18px; flex-wrap: wrap; }
.tally svg { width: 54px; height: 44px; }
.tally line { stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
.signin-pad { flex: 1 1 320px; padding: 28px; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; }
.dots { display: flex; gap: 14px; height: 22px; align-items: center; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.dot.filled { background: var(--accent); border-color: var(--accent); }
.keypad { display: grid; grid-template-columns: repeat(3, 78px); gap: 10px; }
.key { height: 66px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.key:active { background: var(--accent); color: var(--accent-ink); }
.key.wide { font-size: 15px; }
.pin-error { color: var(--low); font-weight: 600; min-height: 1.45em; text-align: center; }
.demo-accounts { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.account { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.account small { display: block; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; flex: 0 0 auto; }

/* ---------- App bar ---------- */
.appbar { background: var(--brand); color: var(--brand-ink); }
.appbar-in { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.brandmark { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brandmark svg { width: 38px; height: 38px; flex: 0 0 auto; }
.brandmark b { font-family: var(--font-display); font-size: 19px; display: block; line-height: 1.15; }
.brandmark small { color: var(--brand-muted); font-size: 14px; overflow-wrap: anywhere; }
.userbox { display: flex; align-items: center; gap: 10px; }
.userbox small { display: block; color: var(--brand-muted); font-size: 13px; }
.btn { min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--low); color: var(--low); }
.btn.ghost { background: transparent; border-color: var(--brand-muted); color: var(--brand-ink); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- Shared pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.pill.low { background: var(--low-bg); color: var(--low); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.is-low span { background: var(--low); }
.bar.is-ok span { background: var(--ok); }

/* ---------- Counting screen ---------- */
.progress { display: flex; flex-direction: row; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.progress-main { flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; }
.progress-main b { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.area { display: flex; flex-direction: column; gap: 8px; }
.area-head { display: flex; align-items: baseline; gap: 10px; padding: 0 4px; flex-wrap: wrap; }
.area-head small { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--ok); border-radius: 14px; padding: 12px 14px; }
.row.is-low { border-left-color: var(--low); }
.row-name { flex: 1 1 210px; display: flex; flex-direction: column; min-width: 0; }
.row-name b { font-weight: 600; overflow-wrap: anywhere; }
.row-name small { color: var(--muted); font-size: 14px; }
.row-name .counted { color: var(--ok); font-weight: 600; }
.controls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.step { width: 56px; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 30px; font-weight: 600; line-height: 1; }
.step:active { background: var(--accent); color: var(--accent-ink); }
.count { width: 78px; height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 24px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.confirm { width: 56px; height: 56px; border-radius: 12px; border: 2px dashed var(--muted); background: transparent; color: var(--muted); display: grid; place-items: center; margin-left: 6px; }
.confirm svg { width: 26px; height: 26px; }
.confirm[aria-pressed="true"] { border: 2px solid var(--ok); background: var(--ok); color: var(--surface); }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* ---------- Overview ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.tile .num { font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile.alert .num { color: var(--low); }
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.team { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.team-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.team-top b { text-transform: capitalize; }
.scroll-x { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.data th { text-align: left; font-size: 14px; color: var(--muted); font-weight: 600; padding: 6px 12px 6px 0; white-space: nowrap; }
table.data td { padding: 10px 12px 10px 0; border-top: 1px solid var(--line); vertical-align: middle; }
table.data .n { text-align: right; }
table.data td:last-child, table.data th:last-child { padding-right: 0; }
.cap { text-transform: capitalize; }
.level { min-width: 90px; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.log .what { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.log time { color: var(--muted); font-size: 14px; white-space: nowrap; }
.log .avatar { width: 30px; height: 30px; font-size: 14px; }

/* ---------- Items screen ---------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 14px; font-weight: 600; }
.field textarea { border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; font: inherit; color: inherit; min-width: 0; resize: vertical; }
.field input, .field select { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; min-width: 0; }
.field .hint { font-size: 13px; color: var(--muted); }
.form-error { color: var(--low); font-weight: 600; }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.row-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 15px; }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; opacity: 0; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .step, .key, .btn, .tab, .confirm { transition: background-color 0.08s; }
  #toast { transition: opacity 0.2s; }
  .bar span { transition: width 0.25s; }
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c2742">
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.103.2"></script>
<script>
/* =====================================================================
   STOCKROOM COUNTER - DATABASE VERSION (Supabase)
   Read top to bottom:
     1. CONNECTION - your Supabase project address and public key
     2. STATE      - what the app remembers while it runs
     3. DATABASE   - reading from and writing to Supabase
     4. HELPERS    - small questions about the data
     5. ACTIONS    - functions that change the data
     6. SCREENS    - functions that turn the data into HTML
     7. EVENTS     - listening for taps and typing
   ===================================================================== */

/* ---------- 1. CONNECTION ---------- */
// Paste the two values from Supabase > Project Settings > API Keys between the quotes.
// Use the PUBLISHABLE key (starts with sb_publishable_). Never paste a secret key here.
const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const SHIFT_HOURS = 12;          // a count stays "done this shift" for this long
const IDLE_MINUTES = 5;          // shared tablet: return to the PIN screen after this long with no taps
const REFRESH_SECONDS = 30;      // safety net: re-read the database this often
const BLANK_STAFF = { name: "", pin: "", role: "employee", group: "" };
const BLANK_DRAFT = { name: "", unit: "", group: "", area: "", count: "0", min: "1", par: "" };

// A secret key must never be in a web page. This checks for the two kinds Supabase issues.
function looksSecret(key) {
  if (key.indexOf("sb_secret_") === 0) return true;
  const parts = key.split(".");
  if (parts.length === 3) {
    try { return JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/"))).role === "service_role"; }
    catch (error) { return false; }
  }
  return false;
}
const keyIsSecret = looksSecret(SUPABASE_KEY);
const configured = /^https:\/\/.+\..+/.test(SUPABASE_URL) && SUPABASE_KEY.length > 20 && SUPABASE_KEY.indexOf("PASTE") !== 0 && !keyIsSecret;

/* ---------- 2. STATE ---------- */

let db = null;               // the Supabase connection
let owner = "";              // id of the signed-in business account
let accountEmail = "";
let phase = "loading";       // "config", "auth", "loading", "error" or "ready"
let loadError = "";
let authMode = "signin";     // "signin" or "signup"
let authDraft = { email: "", password: "", business: "" };
let authError = "";
let authNotice = "";
let busy = false;            // true while a form is being saved, to stop double taps

let business = "";
let staff = [];              // everyone who can sign in with a PIN
let items = [];
let log = [];
let currentUser = null;      // the person signed in with a PIN, or null
let pinEntry = "";
let pinError = "";
let view = "stock";          // "stock", "overview", "items" or "people"
let filter = "all";          // "all", "low" or "todo"
let draft = Object.assign({}, BLANK_DRAFT);
let editingId = null;
let formError = "";
let pendingRemoveId = null;
let staffDraft = Object.assign({}, BLANK_STAFF);
let editingStaffId = null;
let staffError = "";
let pendingStaffRemoveId = null;
let setupDraft = { business: "", name: "", pin: "", pin2: "" };
let setupError = "";
let pendingAccountOut = false;

/* ---------- 3. DATABASE ---------- */
// Supabase answers every request with { data, error }. Each helper below checks the error.

// The database uses different column names than the app. These two translate a row.
function itemFromRow(row) {
  return { id: row.id, group: row.team, area: row.area, name: row.name, unit: row.unit,
           count: row.on_hand, min: row.min_level, par: row.par_level,
           countedAt: row.counted_at ? Date.parse(row.counted_at) : null, countedBy: row.counted_by || "" };
}
function logFromRow(row) {
  return { kind: row.kind, itemId: row.item_id, item: row.item, who: row.who,
           from: row.from_count, to: row.to_count, text: row.note, time: Date.parse(row.created_at) };
}
function staffFromRow(row) {
  return { id: row.id, pin: row.pin, name: row.name, role: row.role, group: row.team };
}

// Reads everything for this business. Returns "" when it worked, or an error message.
async function fetchAll() {
  try {
    const results = await Promise.all([
      db.from("businesses").select("name").eq("owner", owner).maybeSingle(),
      db.from("staff").select("*").eq("owner", owner).order("id"),
      db.from("items").select("*").eq("owner", owner).order("id"),
      db.from("activity").select("*").eq("owner", owner).order("created_at", { ascending: false }).limit(60)
    ]);
    const failed = results.find(function (r) { return r.error; });
    if (failed) return failed.error.message || "The database refused the request.";

    business = results[0].data ? results[0].data.name : business;
    staff = results[1].data.map(staffFromRow);
    const fresh = results[2].data.map(itemFromRow);
    // Keep any count that is still being tapped on this device and not saved yet.
    fresh.forEach(function (item) {
      if (pending[item.id]) {
        const local = findItem(item.id);
        if (local) { item.count = local.count; item.countedAt = local.countedAt; item.countedBy = local.countedBy; }
      }
    });
    items = fresh;
    log = results[3].data.map(logFromRow);

    // The signed-in person may have been edited or removed on another device.
    if (currentUser !== null) {
      const same = staff.find(function (p) { return p.id === currentUser.id; });
      if (same) currentUser = same; else signOut();
    }
    return "";
  } catch (error) {
    return "Could not reach the database. Check the internet connection.";
  }
}

// Sends one change to the database. Returns the saved row (or true), or null when it failed.
async function send(request, what) {
  try {
    const result = await request;
    if (result.error) {
      showToast("Could not save " + what + ". " + (result.error.message || ""));
      scheduleRefresh(0);
      return null;
    }
    return result.data || true;
  } catch (error) {
    showToast("Could not save " + what + ". Check the internet connection.");
    return null;
  }
}

// Re-reads the database soon. Several calls close together turn into one read.
let refreshTimer = null;
function scheduleRefresh(delay) {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async function () {
    if (phase !== "ready" || busy) return;
    const problem = await fetchAll();
    if (problem !== "") return;                       // keep showing what we have; the next try may work
    const typingCount = document.activeElement && document.activeElement.classList.contains("count");
    if (!typingCount) render();                        // do not redraw under someone typing a number
  }, delay);
}

// Live updates: Supabase tells this device when another device changes something.
let channel = null;
function listenForChanges() {
  if (channel) return;
  channel = db.channel("stockroom-" + owner);
  ["businesses", "staff", "items", "activity"].forEach(function (table) {
    channel.on("postgres_changes", { event: "*", schema: "public", table: table }, function () { scheduleRefresh(400); });
  });
  channel.subscribe();
}
function stopListening() {
  if (channel) { db.removeChannel(channel); channel = null; }
}

// Called once the business account is signed in.
async function enterAccount(user) {
  owner = user.id;
  accountEmail = user.email || "";
  phase = "loading";
  render();
  const problem = await fetchAll();
  if (problem !== "") { phase = "error"; loadError = problem; render(); return; }

  // First time in: create the business row, using the name typed when the account was made.
  const typedName = user.user_metadata && user.user_metadata.business ? user.user_metadata.business : "";
  if (business === "" && typedName !== "") {
    business = typedName;
    await send(db.from("businesses").upsert({ owner: owner, name: business }, { onConflict: "owner" }), "the business name");
  }
  setupDraft.business = business;
  phase = "ready";
  listenForChanges();
  render();
}

async function leaveAccount() {
  await flushAllCounts();
  stopListening();
  try { await db.auth.signOut(); } catch (error) { /* already signed out */ }
  signOut();
  owner = ""; accountEmail = ""; business = ""; staff = []; items = []; log = [];
  authDraft = { email: "", password: "", business: "" };
  authError = ""; authNotice = ""; authMode = "signin";
  phase = "auth";
}

// Everything the app knows, as one piece of text that can be kept somewhere safe.
function backupText() {
  return JSON.stringify({ app: "stockroom-counter", savedAt: new Date().toISOString(), business: business, staff: staff, items: items, log: log });
}

/* ---------- 4. HELPERS ---------- */

// Makes typed text safe to place inside HTML.
function esc(text) {
  return String(text).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}
function findItem(id) { return items.find(function (item) { return item.id === id; }); }
function isLow(item) { return item.count < item.min; }
function isCounted(item) { return item.countedAt !== null && Date.now() - item.countedAt < SHIFT_HOURS * 3600000; }
function orderQty(item) { return Math.max(item.par - item.count, 0); }
function clock(time) { return new Date(time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

// An employee sees only their own team's items. The manager sees everything.
function itemsForUser(user) {
  if (user.role === "manager") return items;
  return items.filter(function (item) { return item.group === user.group; });
}

// Unique values of one field, in the order they first appear. Used for teams and areas.
function unique(list, field) {
  const seen = [];
  list.forEach(function (entry) { if (!seen.includes(entry[field])) seen.push(entry[field]); });
  return seen;
}

/* ---------- 5. ACTIONS ---------- */

function markCounted(item) {
  item.countedAt = Date.now();
  item.countedBy = currentUser.name;
}

// Counts are saved a moment after the last tap, so ten quick taps become one save.
const pending = {};      // item id -> { from, who, timer }

// The one function that changes a count. Buttons and typing both end up here.
function setCount(id, newCount) {
  const item = findItem(id);
  if (!item || Number.isNaN(newCount)) return;
  newCount = Math.max(0, Math.round(newCount));      // never below zero
  if (newCount === item.count) return;
  const oldCount = item.count;
  item.count = newCount;
  markCounted(item);

  // Show the change in the activity list straight away.
  const last = log[0];
  if (last && last.kind === "count" && last.itemId === id && last.who === currentUser.name && pending[id]) {
    last.to = newCount;
    last.time = Date.now();
  } else {
    log.unshift({ kind: "count", itemId: id, item: item.name, who: currentUser.name, from: oldCount, to: newCount, time: Date.now() });
  }

  if (!pending[id]) pending[id] = { from: oldCount, who: currentUser.name, timer: null };
  clearTimeout(pending[id].timer);
  pending[id].timer = setTimeout(function () { flushCount(id); }, 1200);
  showToast(item.name + ": " + newCount + " " + item.unit);
}

// Writes one item's final count to the database, plus one line of activity.
async function flushCount(id) {
  const burst = pending[id];
  if (!burst) return;
  clearTimeout(burst.timer);
  delete pending[id];
  const item = findItem(id);
  if (!item) return;
  await send(db.from("items").update({
    on_hand: item.count,
    counted_at: new Date(item.countedAt || Date.now()).toISOString(),
    counted_by: burst.who
  }).eq("id", id).eq("owner", owner), item.name);
  if (burst.from !== item.count) {
    await send(db.from("activity").insert({ owner: owner, who: burst.who, kind: "count", item_id: id, item: item.name, from_count: burst.from, to_count: item.count }), "the activity line");
  }
}

function flushAllCounts() {
  return Promise.all(Object.keys(pending).map(function (id) { return flushCount(Number(id)); }));
}

// "The number on screen is right" - marks the item counted without changing it.
async function confirmCount(id) {
  const item = findItem(id);
  if (!item) return;
  if (isCounted(item)) { item.countedAt = null; item.countedBy = ""; }
  else { markCounted(item); showToast(item.name + " marked counted"); }
  render();
  await send(db.from("items").update({
    counted_at: item.countedAt ? new Date(item.countedAt).toISOString() : null,
    counted_by: item.countedBy
  }).eq("id", id).eq("owner", owner), item.name);
}

async function addNote(text) {
  const who = currentUser.name;
  log.unshift({ kind: "note", who: who, text: text, time: Date.now() });
  await send(db.from("activity").insert({ owner: owner, who: who, kind: "note", note: text }), "the activity line");
}

// Checks the add/edit form and saves it. Returns an error message, or "" when it worked.
async function saveItemFromDraft() {
  const name = draft.name.trim();
  const unit = draft.unit.trim() || "units";
  const group = draft.group.trim().toLowerCase();
  const area = draft.area.trim() || "General";
  const count = parseInt(draft.count, 10);
  const min = parseInt(draft.min, 10);
  const par = draft.par.trim() === "" ? NaN : parseInt(draft.par, 10);

  if (name === "") return "Give the item a name.";
  if (group === "") return "Choose which team counts this item.";
  if (Number.isNaN(count) || count < 0) return "On hand must be a number, 0 or more.";
  if (Number.isNaN(min) || min < 0) return "Minimum must be a number, 0 or more.";
  const target = Number.isNaN(par) ? Math.max(min * 2, min + 1) : par;   // sensible default when left blank
  if (target < min) return "Stock up to must be at least the minimum.";

  const row = { owner: owner, team: group, area: area, name: name, unit: unit, on_hand: count, min_level: min, par_level: target };
  if (editingId === null) {
    row.counted_at = new Date().toISOString();
    row.counted_by = currentUser.name;
    const saved = await send(db.from("items").insert(row).select().single(), name);
    if (!saved) return "The item was not saved. Try again.";
    items.push(itemFromRow(saved));
    addNote("added " + name + " (" + count + " " + unit + ")");
    showToast(name + " added");
  } else {
    await flushCount(editingId);
    const saved = await send(db.from("items").update(row).eq("id", editingId).eq("owner", owner).select().single(), name);
    if (!saved) return "The changes were not saved. Try again.";
    Object.assign(findItem(editingId), itemFromRow(saved));
    addNote("edited " + name);
    showToast(name + " updated");
  }
  draft = Object.assign({}, BLANK_DRAFT);
  editingId = null;
  return "";
}

function startEdit(id) {
  const item = findItem(id);
  if (!item) return;
  editingId = id;
  formError = "";
  draft = { name: item.name, unit: item.unit, group: item.group, area: item.area, count: String(item.count), min: String(item.min), par: String(item.par) };
}

async function removeItem(id) {
  const item = findItem(id);
  if (!item) return;
  if (pending[id]) { clearTimeout(pending[id].timer); delete pending[id]; }
  const done = await send(db.from("items").delete().eq("id", id).eq("owner", owner), "the removal");
  if (!done) return;
  items = items.filter(function (entry) { return entry.id !== id; });
  if (editingId === id) { editingId = null; draft = Object.assign({}, BLANK_DRAFT); }
  addNote("removed " + item.name);
  showToast(item.name + " removed");
}

// Checks the add/edit person form and saves it. Returns an error message, or "".
async function saveStaffFromDraft() {
  const name = staffDraft.name.trim();
  const pin = staffDraft.pin.trim();
  const role = staffDraft.role === "manager" ? "manager" : "employee";
  const group = role === "manager" ? "all" : staffDraft.group.trim().toLowerCase();

  if (name === "") return "Give the person a name.";
  if (!/^[0-9]{4}$/.test(pin)) return "The PIN must be exactly 4 digits.";
  const clash = staff.find(function (p) { return p.pin === pin && p.id !== editingStaffId; });
  if (clash) return "That PIN is already used by " + clash.name + ". Pick a different one.";
  if (role === "employee" && group === "") return "Choose which team this employee counts for.";

  const row = { owner: owner, name: name, pin: pin, role: role, team: group };
  if (editingStaffId === null) {
    const saved = await send(db.from("staff").insert(row).select().single(), name);
    if (!saved) return "The sign-in was not saved. Try again.";
    staff.push(staffFromRow(saved));
    addNote("added " + name + " as " + (role === "manager" ? "a manager" : "an employee"));
    showToast(name + " can now sign in");
  } else {
    const person = staff.find(function (p) { return p.id === editingStaffId; });
    const managers = staff.filter(function (p) { return p.role === "manager"; });
    if (person.role === "manager" && role !== "manager" && managers.length === 1) return "There must be at least one manager.";
    const saved = await send(db.from("staff").update(row).eq("id", editingStaffId).eq("owner", owner).select().single(), name);
    if (!saved) return "The changes were not saved. Try again.";
    Object.assign(person, staffFromRow(saved));
    addNote("updated the sign-in for " + name);
    showToast(name + " updated");
  }
  staffDraft = Object.assign({}, BLANK_STAFF);
  editingStaffId = null;
  return "";
}

function startStaffEdit(id) {
  const person = staff.find(function (p) { return p.id === id; });
  if (!person) return;
  editingStaffId = id;
  staffError = "";
  staffDraft = { name: person.name, pin: person.pin, role: person.role, group: person.role === "manager" ? "" : person.group };
}

// Returns an error message when the person cannot be removed, or "" when it worked.
async function removeStaff(id) {
  const person = staff.find(function (p) { return p.id === id; });
  if (!person) return "";
  if (person.id === currentUser.id) return "You are signed in as " + person.name + ". Ask another manager to remove this sign-in.";
  const done = await send(db.from("staff").delete().eq("id", id).eq("owner", owner), "the removal");
  if (!done) return "The sign-in was not removed. Try again.";
  staff = staff.filter(function (p) { return p.id !== id; });
  if (editingStaffId === id) { editingStaffId = null; staffDraft = Object.assign({}, BLANK_STAFF); }
  addNote("removed the sign-in for " + person.name);
  showToast(person.name + " removed");
  return "";
}

// First run: saves the business name and creates the first manager. Returns an error message or "".
async function createFirstManager() {
  const name = setupDraft.name.trim();
  const pin = setupDraft.pin.trim();
  if (name === "") return "Enter your name.";
  if (!/^[0-9]{4}$/.test(pin)) return "The PIN must be exactly 4 digits.";
  if (pin !== setupDraft.pin2.trim()) return "The two PINs do not match.";

  const typed = setupDraft.business.trim();
  if (typed !== business) {
    business = typed;
    await send(db.from("businesses").upsert({ owner: owner, name: business }, { onConflict: "owner" }), "the business name");
  }
  const saved = await send(db.from("staff").insert({ owner: owner, name: name, pin: pin, role: "manager", team: "all" }).select().single(), "the manager sign-in");
  if (!saved) return "The sign-in was not saved. Try again.";
  const person = staffFromRow(saved);
  staff = [person];
  setupDraft = { business: business, name: "", pin: "", pin2: "" };
  signIn(person);
  view = "items";
  showToast("Welcome, " + name + ". Add your first item.");
  return "";
}

async function saveBusinessName(name) {
  business = name;
  const done = await send(db.from("businesses").upsert({ owner: owner, name: business }, { onConflict: "owner" }), "the business name");
  if (done) showToast("Business name saved");
}

// Business account: create one, or sign in to one. Returns an error message or "".
async function submitAccount() {
  const email = authDraft.email.trim();
  const password = authDraft.password;
  if (!/^\S+@\S+\.\S+$/.test(email)) return "Enter a valid email address.";
  if (password.length < 8) return "The password must be at least 8 characters.";
  try {
    if (authMode === "signup") {
      const result = await db.auth.signUp({ email: email, password: password, options: { data: { business: authDraft.business.trim() } } });
      if (result.error) return result.error.message;
      if (result.data && result.data.session) { await enterAccount(result.data.session.user); return ""; }
      authMode = "signin";
      authDraft.password = "";
      authNotice = "Account created. Open the confirmation email we sent to " + email + ", then sign in here.";
      return "";
    }
    const result = await db.auth.signInWithPassword({ email: email, password: password });
    if (result.error) return result.error.message;
    authDraft.password = "";
    await enterAccount(result.data.user);
    return "";
  } catch (error) {
    return "Could not reach the database. Check the internet connection.";
  }
}

function signIn(person) {
  currentUser = person;
  view = person.role === "manager" ? "overview" : "stock";
  filter = "all";
  pinEntry = "";
  pinError = "";
}

function pressPinKey(digit) {
  if (pinEntry.length >= 4) return;
  pinEntry += digit;
  pinError = "";
  if (pinEntry.length === 4) {
    const match = staff.find(function (person) { return person.pin === pinEntry; });
    if (match) signIn(match);
    else { pinError = "That PIN does not match anyone. Try again."; pinEntry = ""; }
  }
}

// Back to the PIN screen. The business account stays connected on this device.
function signOut() {
  flushAllCounts();
  currentUser = null;
  pinEntry = "";
  pinError = "";
  editingId = null;
  pendingRemoveId = null;
  formError = "";
  draft = Object.assign({}, BLANK_DRAFT);
  editingStaffId = null;
  pendingStaffRemoveId = null;
  staffError = "";
  staffDraft = Object.assign({}, BLANK_STAFF);
  pendingAccountOut = false;
}

let toastTimer = null;
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
}

const app = document.getElementById("app");

const LOGO = '<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#f5a524"/><g stroke="#1c1400" stroke-width="3.2" stroke-linecap="round"><line x1="11" y1="11" x2="11" y2="29"/><line x1="17" y1="11" x2="17" y2="29"/><line x1="23" y1="11" x2="23" y2="29"/><line x1="29" y1="11" x2="29" y2="29"/><line x1="7" y1="26" x2="33" y2="14"/></g></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const TALLY = '<svg viewBox="0 0 54 44" aria-hidden="true"><line x1="8" y1="6" x2="8" y2="38"/><line x1="19" y1="6" x2="19" y2="38"/><line x1="30" y1="6" x2="30" y2="38"/><line x1="41" y1="6" x2="41" y2="38"/><line x1="2" y1="32" x2="50" y2="12"/></svg>';

// render() redraws the page from the current state. Call it after anything changes.
function render() {
  const focusedId = document.activeElement ? document.activeElement.id : "";
  if (phase === "config") app.innerHTML = configScreen();
  else if (phase === "auth") app.innerHTML = authScreen();
  else if (phase === "loading") app.innerHTML = messageScreen("Loading your stockroom...", "");
  else if (phase === "error") app.innerHTML = messageScreen("Could not load", loadError, '<button class="btn primary" id="retry" data-action="retry">Try again</button>');
  else if (staff.length === 0) app.innerHTML = setupScreen();
  else if (currentUser === null) app.innerHTML = signInScreen();
  else {
    let body = stockScreen();
    if (currentUser.role === "manager" && view === "overview") body = overviewScreen();
    if (currentUser.role === "manager" && view === "items") body = itemsScreen();
    if (currentUser.role === "manager" && view === "people") body = staffScreen();
    app.innerHTML = appBar() + '<main class="page">' + body + "</main>";
  }
  // Put keyboard focus back where it was, since the page was redrawn.
  if (focusedId) {
    const again = document.getElementById(focusedId);
    if (again) again.focus({ preventScroll: true });
  }
}

function setupScreen() {
  const f = function (key, label, hint, extra) {
    return `<div class="field"><label for="u-${key}">${label}</label>
      <input id="u-${key}" data-setup="${key}" value="${esc(setupDraft[key])}" autocomplete="off" ${extra || ""}>
      ${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
  };
  return `<main class="page">
    <section class="signin">
      <div class="signin-brand">
        <div class="brandmark">${LOGO}<div><b>Stockroom Counter</b><small>First-time setup</small></div></div>
        <div>
          <h1>Set up your stockroom.</h1>
          <p style="margin-top:12px">Create the first manager sign-in. After that you add your own items and the people who count them.</p>
        </div>
        <div class="tally">${TALLY}${TALLY}${TALLY}</div>
      </div>
      <div class="signin-pad" style="align-items:stretch">
        <h2>Create the manager sign-in</h2>
        <form id="setup-form" novalidate style="display:flex;flex-direction:column;gap:12px">
          ${f("business", "Business name", "Shown at the top of every screen. You can change it later")}
          ${f("name", "Your name", "")}
          ${f("pin", "Choose a 4-digit PIN", "", 'inputmode="numeric" maxlength="4" type="password"')}
          ${f("pin2", "Type the PIN again", "Staff use PINs after this. Other managers can change yours later", 'inputmode="numeric" maxlength="4" type="password"')}
          <p class="form-error" role="alert">${setupError}</p>
          <button class="btn primary" id="setup-save" type="submit">Create sign-in and start</button>
        </form>
      </div>
    </section>
  </main>`;
}

function signInScreen() {
  let dots = "";
  for (let i = 0; i < 4; i++) dots += `<span class="dot${i < pinEntry.length ? " filled" : ""}"></span>`;
  let keys = "";
  ["1","2","3","4","5","6","7","8","9"].forEach(function (d) { keys += `<button class="key" id="key-${d}" data-key="${d}">${d}</button>`; });
  keys += `<button class="key wide" id="key-clear" data-key="clear">Clear</button>`;
  keys += `<button class="key" id="key-0" data-key="0">0</button>`;
  keys += `<button class="key wide" id="key-back" data-key="back" aria-label="Delete last digit">Delete</button>`;

  return `<main class="page">
    <section class="signin">
      <div class="signin-brand">
        <div class="brandmark">${LOGO}<div><b>Stockroom Counter</b><small>${esc(business)}</small></div></div>
        <div>
          <h1>Count stock in a few taps.</h1>
          <p style="margin-top:12px">Every count is saved with a name and a time. Anything running low shows up on the reorder list by itself.</p>
        </div>
        <div class="tally">${TALLY}${TALLY}${TALLY}</div>
      </div>
      <div class="signin-pad" aria-label="PIN entry">
        <h2>Enter your PIN</h2>
        <div class="dots" aria-label="${pinEntry.length} of 4 digits entered">${dots}</div>
        <div class="keypad">${keys}</div>
        <p class="pin-error" role="alert">${pinError}</p>
      </div>

}

function appBar() {
  const isManager = currentUser.role === "manager";
  return `<header class="appbar"><div class="appbar-in">
    <div class="brandmark">${LOGO}<div><b>Stockroom Counter</b><small>${esc(business)}</small></div></div>
    <div class="userbox">
      <span class="avatar">${currentUser.name[0]}</span>
      <span><b>${currentUser.name}</b><small class="cap">${isManager ? "Manager" : currentUser.group}</small></span>
      <button class="btn ghost" id="signout" data-action="signout">Sign out</button>
    </div>
  </div></header>`;
}

function managerTabs() {
  if (currentUser.role !== "manager") return "";
  const tab = function (name, label) {
    return `<button class="tab" id="tab-${name}" data-view="${name}" aria-pressed="${view === name}">${label}</button>`;
  };
  return `<nav class="tabs" aria-label="Sections">${tab("overview", "Overview")}${tab("stock", "Count stock")}${tab("items", "Manage items")}${tab("people", "Manage staff")}</nav>`;
}

function stockScreen() {
  const visible = itemsForUser(currentUser);
  const lowCount = visible.filter(isLow).length;
  const doneCount = visible.filter(isCounted).length;
  const percent = visible.length ? Math.round((doneCount / visible.length) * 100) : 0;

  let shown = visible;
  if (filter === "low") shown = visible.filter(isLow);
  if (filter === "todo") shown = visible.filter(function (item) { return !isCounted(item); });

  const chip = function (name, label) {
    return `<button class="tab" id="filter-${name}" data-filter="${name}" aria-pressed="${filter === name}">${label}</button>`;
  };

  let html = managerTabs() + `
    <section class="card progress">
      <div class="progress-main">
        <b>${doneCount} of ${visible.length} counted this shift</b>
        <div class="bar${percent === 100 ? " is-ok" : ""}"><span style="width:${percent}%"></span></div>
      </div>
      ${lowCount > 0 ? `<span class="pill low">${lowCount} running low</span>` : `<span class="pill ok">Everything stocked</span>`}
    </section>
    <nav class="tabs" aria-label="Filter items">
      ${chip("all", "All " + visible.length)}${chip("todo", "Not counted " + (visible.length - doneCount))}${chip("low", "Low " + lowCount)}
    </nav>`;

  if (shown.length === 0) {
    html += `<div class="card empty">${filter === "todo" ? "Every item here has been counted this shift." : filter === "low" ? "Nothing is running low." : "No items yet. A manager can add some under Manage items."}</div>`;
  }

  unique(shown, "area").forEach(function (area) {
    const inArea = shown.filter(function (item) { return item.area === area; });
    html += `<section class="area"><div class="area-head"><h2>${esc(area)}</h2><small>${inArea.length} ${inArea.length === 1 ? "item" : "items"}${currentUser.role === "manager" ? ` · <span class="cap">${esc(inArea[0].group)}</span>` : ""}</small></div>`;
    inArea.forEach(function (item) { html += itemRow(item); });
    html += "</section>";
  });
  return html;
}

function itemRow(item) {
  const low = isLow(item);
  const done = isCounted(item);
  const n = esc(item.name);
  return `<div class="row${low ? " is-low" : ""}">
    <div class="row-name"><b>${n}</b><small>${esc(item.unit)} · minimum ${item.min}</small>
      ${done ? `<small class="counted">Counted ${clock(item.countedAt)} by ${esc(item.countedBy)}</small>` : `<small>Not counted yet</small>`}</div>
    ${low ? '<span class="pill low">Low</span>' : '<span class="pill ok">OK</span>'}
    <div class="controls">
      <button class="step" id="minus-${item.id}" data-step="-1" data-id="${item.id}" aria-label="Remove one ${n}">−</button>
      <input class="count" id="count-${item.id}" data-id="${item.id}" type="text" inputmode="numeric" value="${item.count}" aria-label="Count of ${n}">
      <button class="step" id="plus-${item.id}" data-step="1" data-id="${item.id}" aria-label="Add one ${n}">+</button>
      <button class="confirm" id="ok-${item.id}" data-confirm="${item.id}" aria-pressed="${done}" aria-label="Mark ${n} as counted">${CHECK}</button>
    </div>
  </div>`;
}

function overviewScreen() {
  const lowItems = items.filter(isLow);
  const doneCount = items.filter(isCounted).length;
  const unitsToOrder = lowItems.reduce(function (sum, item) { return sum + orderQty(item); }, 0);

  let teamCards = "";
  unique(items, "group").forEach(function (group) {
    const mine = items.filter(function (item) { return item.group === group; });
    const low = mine.filter(isLow).length;
    const done = mine.filter(isCounted).length;
    const percent = Math.round((done / mine.length) * 100);
    teamCards += `<div class="team">
      <div class="team-top"><b>${esc(group)}</b>${low ? `<span class="pill low">${low} low</span>` : `<span class="pill ok">Stocked</span>`}</div>
      <div class="bar${percent === 100 ? " is-ok" : ""}"><span style="width:${percent}%"></span></div>
      <span class="note">${done} of ${mine.length} counted this shift</span></div>`;
  });

  let reorderRows = "";
  lowItems.forEach(function (item) {
    const fill = item.par > 0 ? Math.min(100, Math.round((item.count / item.par) * 100)) : 0;
    reorderRows += `<tr><td>${esc(item.name)} <span class="muted">(${esc(item.unit)})</span></td><td class="cap">${esc(item.group)}</td>
      <td class="level"><div class="bar is-low"><span style="width:${fill}%"></span></div></td>
      <td class="n">${item.count}</td><td class="n">${item.min}</td><td class="n"><b>${orderQty(item)}</b></td></tr>`;
  });

  let logRows = "";
  log.slice(0, 10).forEach(function (entry) {
    const what = entry.kind === "count"
      ? `changed ${esc(entry.item)} from ${entry.from} to ${entry.to}`
      : esc(entry.text);
    logRows += `<li><span class="avatar">${esc(entry.who[0])}</span><span class="what"><b>${esc(entry.who)}</b> ${what}</span><time>${clock(entry.time)}</time></li>`;
  });

  const started = items.length === 0
    ? `<section class="card"><h2>Getting started</h2>
        <p>1. Open <b>Manage items</b> and add what you keep in stock, with a minimum for each.</p>
        <p>2. Open <b>Manage staff</b> and give each person a name, a PIN and a team.</p>
        <p>3. Staff sign in with their PIN and tap their counts. Anything low appears here.</p></section>`
    : "";

  return managerTabs() + started + `
    <div class="tiles">
      <div class="tile"><div class="num">${items.length}</div><div class="muted">items tracked</div></div>
      <div class="tile${lowItems.length ? " alert" : ""}"><div class="num">${lowItems.length}</div><div class="muted">running low</div></div>
      <div class="tile"><div class="num">${doneCount}/${items.length}</div><div class="muted">counted this shift</div></div>
      <div class="tile"><div class="num">${unitsToOrder}</div><div class="muted">units to reorder</div></div>
    </div>

    <section class="card"><h2>Teams</h2><div class="teams">${teamCards || '<p class="muted">No items yet.</p>'}</div></section>

    <section class="card"><div class="card-head"><h2>Reorder list</h2>
      ${lowItems.length ? '<button class="btn" id="copy-btn" data-action="copy">Copy list</button>' : ""}</div>
      ${lowItems.length
        ? `<div class="scroll-x"><table class="data"><thead><tr><th>Item</th><th>Team</th><th>Level</th><th class="n">On hand</th><th class="n">Minimum</th><th class="n">Order</th></tr></thead><tbody>${reorderRows}</tbody></table></div>
           <p class="note">Order is the amount that brings each item back up to its stock-up-to level.</p>`
        : '<p class="muted">Nothing is below its minimum.</p>'}
    </section>

    <section class="card"><h2>Recent activity</h2>
      ${logRows ? `<ul class="log">${logRows}</ul>` : '<p class="muted">No changes yet.</p>'}
    </section>`;
}

function itemsScreen() {
  const field = function (key, label, hint, extra) {
    return `<div class="field"><label for="f-${key}">${label}</label>
      <input id="f-${key}" data-draft="${key}" value="${esc(draft[key])}" ${extra || ""}>
      ${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
  };
  const options = function (field, extraList) {
    return unique(items, field).map(function (v) { return v; }).concat(extraList || [])
      .filter(function (v, i, all) { return all.indexOf(v) === i; })
      .map(function (v) { return `<option value="${esc(v)}">`; }).join("");
  };
  const staffGroups = staff.filter(function (p) { return p.role !== "manager"; }).map(function (p) { return p.group; });

  let rows = "";
  items.forEach(function (item) {
    const waiting = pendingRemoveId === item.id;
    rows += `<tr><td>${esc(item.name)} <span class="muted">(${esc(item.unit)})</span></td>
      <td class="cap">${esc(item.group)}</td><td>${esc(item.area)}</td>
      <td class="n">${item.count}</td><td class="n">${item.min}</td><td class="n">${item.par}</td>
      <td><div class="row-actions">
        <button class="btn small" id="edit-${item.id}" data-edit="${item.id}">Edit</button>
        <button class="btn small danger" id="remove-${item.id}" data-remove="${item.id}">${waiting ? "Tap again to remove" : "Remove"}</button>
      </div></td></tr>`;
  });

  return managerTabs() + `
    <section class="card">
      <h2>${editingId === null ? "Add an item" : "Edit item"}</h2>
      <form id="item-form" novalidate>
        <div class="form-grid">
          ${field("name", "Item name", "For example: Coffee filters", 'autocomplete="off"')}
          ${field("unit", "Counted in", "boxes, cases, rolls, bottles", 'autocomplete="off"')}
          ${field("group", "Team that counts it", "Pick one or type a new team", 'list="team-list" autocomplete="off"')}
          ${field("area", "Where it is stored", "Pick one or type a new place", 'list="area-list" autocomplete="off"')}
          ${field("count", "On hand now", "", 'inputmode="numeric"')}
          ${field("min", "Minimum", "Flagged as low below this", 'inputmode="numeric"')}
          ${field("par", "Stock up to", "Optional. Sets the order amount", 'inputmode="numeric"')}
        </div>
        <datalist id="team-list">${options("group", staffGroups)}</datalist>
        <datalist id="area-list">${options("area")}</datalist>
        <p class="form-error" role="alert" style="margin-top:12px">${formError}</p>
        <div class="form-actions" style="margin-top:4px">
          <button class="btn primary" id="save-item" type="submit">${editingId === null ? "Add item" : "Save changes"}</button>
          ${editingId !== null ? '<button class="btn" id="cancel-edit" type="button" data-action="cancel-edit">Cancel</button>' : ""}
        </div>
      </form>
    </section>

    <section class="card"><h2>All items (${items.length})</h2>
      ${items.length
        ? `<div class="scroll-x"><table class="data"><thead><tr><th>Item</th><th>Team</th><th>Stored in</th><th class="n">On hand</th><th class="n">Minimum</th><th class="n">Stock up to</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
        : '<p class="muted">No items yet. Add your first one above.</p>'}
    </section>

    <section class="card"><h2>Settings</h2>
      <div class="form-grid">
        <div class="field"><label for="business-name">Business name</label>
          <input id="business-name" value="${esc(business)}" autocomplete="off"><span class="hint">Shown at the top of every screen</span></div>
      </div>
      <p class="note">This device is connected to the business account ${esc(accountEmail)}. Every device signed in to that account shares the same items, staff and counts. The PIN screen comes back after ${IDLE_MINUTES} minutes without a tap.</p>
      <div class="form-actions">
        <button class="btn" id="backup-btn" data-action="backup">Copy backup</button>
        <button class="btn danger" id="account-out" data-action="account-out">${pendingAccountOut ? "Tap again to disconnect this device" : "Disconnect this device"}</button>
      </div>
      <p class="note">Copy backup copies everything as text for your own records. Disconnecting signs this device out of the business account. Your data stays safe in the database.</p>
    </section>`;
}

function staffScreen() {
  const teams = unique(items, "group")
    .concat(staff.filter(function (p) { return p.role !== "manager"; }).map(function (p) { return p.group; }))
    .filter(function (v, i, all) { return all.indexOf(v) === i; });
  const isManagerDraft = staffDraft.role === "manager";

  let rows = "";
  staff.forEach(function (person) {
    const waiting = pendingStaffRemoveId === person.id;
    const you = person.id === currentUser.id;
    rows += `<tr><td><b>${esc(person.name)}</b>${you ? ' <span class="muted">(you)</span>' : ""}</td>
      <td>${person.role === "manager" ? '<span class="pill ok">Manager</span>' : "Employee"}</td>
      <td class="cap">${person.role === "manager" ? "All teams" : esc(person.group)}</td>
      <td>${esc(person.pin)}</td>
      <td><div class="row-actions">
        <button class="btn small" id="edit-staff-${person.id}" data-edit-staff="${person.id}">Edit</button>
        <button class="btn small danger" id="remove-staff-${person.id}" data-remove-staff="${person.id}">${waiting ? "Tap again to remove" : "Remove"}</button>
      </div></td></tr>`;
  });

  return managerTabs() + `
    <section class="card">
      <h2>${editingStaffId === null ? "Add a person" : "Edit sign-in"}</h2>
      <form id="staff-form" novalidate>
        <div class="form-grid">
          <div class="field"><label for="s-name">Name</label>
            <input id="s-name" data-sdraft="name" value="${esc(staffDraft.name)}" autocomplete="off"></div>
          <div class="field"><label for="s-pin">PIN</label>
            <input id="s-pin" data-sdraft="pin" value="${esc(staffDraft.pin)}" inputmode="numeric" maxlength="4" autocomplete="off">
            <span class="hint">4 digits, different for each person</span></div>
          <div class="field"><label for="s-role">Role</label>
            <select id="s-role" data-sdraft="role">
              <option value="employee"${isManagerDraft ? "" : " selected"}>Employee</option>
              <option value="manager"${isManagerDraft ? " selected" : ""}>Manager</option>
            </select>
            <span class="hint">${isManagerDraft ? "Sees every team, the reorder list and these settings" : "Counts stock for one team"}</span></div>
          ${isManagerDraft ? "" : `<div class="field"><label for="s-group">Team</label>
            <input id="s-group" data-sdraft="group" value="${esc(staffDraft.group)}" list="staff-team-list" autocomplete="off">
            <span class="hint">Pick one or type a new team</span></div>`}
        </div>
        <datalist id="staff-team-list">${teams.map(function (t) { return `<option value="${esc(t)}">`; }).join("")}</datalist>
        <p class="form-error" role="alert" style="margin-top:12px">${staffError}</p>
        <div class="form-actions" style="margin-top:4px">
          <button class="btn primary" id="save-staff" type="submit">${editingStaffId === null ? "Add person" : "Save changes"}</button>
          ${editingStaffId !== null ? '<button class="btn" id="cancel-staff" type="button" data-action="cancel-staff">Cancel</button>' : ""}
        </div>
      </form>
    </section>

    <section class="card"><h2>Who can sign in (${staff.length})</h2>
      <div class="scroll-x"><table class="data"><thead><tr><th>Name</th><th>Role</th><th>Team</th><th>PIN</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">Managers can count stock for every team, see the overview, and manage items and staff. Employees only see the counting screen for their own team.</p>
    </section>`;
}


// ----- Screens that only the database version needs -----

function brandPanel(sub, headline, text) {
  return `<div class="signin-brand">
    <div class="brandmark">${LOGO}<div><b>Stockroom Counter</b><small>${sub}</small></div></div>
    <div><h1>${headline}</h1><p style="margin-top:12px">${text}</p></div>
    <div class="tally">${TALLY}${TALLY}${TALLY}</div>
  </div>`;
}

function configScreen() {
  return `<main class="page"><section class="signin">
    ${brandPanel("Not connected yet", "Connect your database.", "This copy of the app has not been given its Supabase project yet.")}
    <div class="signin-pad" style="align-items:stretch">
      <h2>Two values are missing</h2>
      ${keyIsSecret ? '<p class="form-error">The key in index.html is a secret key. Remove it now and use the publishable key instead. A secret key in a web page gives anyone full access to your data.</p>' : ""}
      <p>1. Open <b>index.html</b> in a text editor and find <b>SUPABASE_URL</b> and <b>SUPABASE_KEY</b> near the top of the script.</p>
      <p>2. In Supabase, open <b>Project Settings</b>, then <b>API Keys</b>. Copy the project URL and the <b>publishable</b> key.</p>

  </section></main>`;

function authScreen() {
  const signup = authMode === "signup";
  const f = function (key, label, hint, extra) {
    return `<div class="field"><label for="a-${key}">${label}</label>
      <input id="a-${key}" data-auth="${key}" value="${esc(authDraft[key])}" ${extra || ""}>
      ${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;

  return `<main class="page"><section class="signin">
    ${brandPanel("Business account", "Count stock in a few taps.", "One account per business. Sign in once on each tablet or phone, then your staff use their PINs.")}

      <h2>${signup ? "Create a business account" : "Sign in to your business"}</h2>
      <form id="auth-form" novalidate style="display:flex;flex-direction:column;gap:12px">

        ${f("email", "Email", "", 'type="email" autocomplete="email" inputmode="email"')}

        ${authNotice ? `<p class="pill ok" style="white-space:normal;border-radius:10px;padding:10px 12px">${esc(authNotice)}</p>` : ""}

function messageScreen(title, text, button) {
  return `<main class="page"><section class="card" style="align-items:center;text-align:center;padding:48px 18px">
    <h2>${title}</h2>${text ? `<p class="muted">${esc(text)}</p>` : ""}${button || ""}</section></main>`;

/* ---------- 7. EVENTS ---------- */

// One listener for every tap. It checks what was tapped and calls the right action.
app.addEventListener("click", async function (event) {
  const target = event.target.closest("button");
  if (!target) return;
  const data = target.dataset;
  if (!data.remove) pendingRemoveId = null;       // any other tap cancels a half-finished removal
  if (!data.removeStaff) pendingStaffRemoveId = null;
  if (data.action !== "account-out") pendingAccountOut = false;

  if (data.key) {
    if (data.key === "clear") { pinEntry = ""; pinError = ""; }
    else if (data.key === "back") { pinEntry = pinEntry.slice(0, -1); }
    else { pressPinKey(data.key); }
  }
  else if (data.step) { const id = Number(data.id); setCount(id, findItem(id).count + Number(data.step)); }
  else if (data.confirm) { confirmCount(Number(data.confirm)); return; }
  else if (data.filter) { filter = data.filter; }
  else if (data.view) { view = data.view; formError = ""; staffError = ""; }
  else if (data.edit) { startEdit(Number(data.edit)); render(); document.getElementById("f-name").focus(); return; }
  else if (data.remove) {
    const id = Number(data.remove);
    if (pendingRemoveId === id) { pendingRemoveId = null; await removeItem(id); }
    else { pendingRemoveId = id; }
  }
  else if (data.editStaff) { startStaffEdit(Number(data.editStaff)); render(); document.getElementById("s-name").focus(); return; }
  else if (data.removeStaff) {
    const id = Number(data.removeStaff);
    if (pendingStaffRemoveId === id) { pendingStaffRemoveId = null; staffError = await removeStaff(id); }
    else { pendingStaffRemoveId = id; staffError = ""; }
  }
  else if (data.action === "cancel-edit") { editingId = null; formError = ""; draft = Object.assign({}, BLANK_DRAFT); }
  else if (data.action === "cancel-staff") { editingStaffId = null; staffError = ""; staffDraft = Object.assign({}, BLANK_STAFF); }
  else if (data.action === "signout") { signOut(); }
  else if (data.action === "auth-switch") { authMode = authMode === "signup" ? "signin" : "signup"; authError = ""; authNotice = ""; }
  else if (data.action === "retry") { start(); return; }
  else if (data.action === "account-out") {
    if (pendingAccountOut) { pendingAccountOut = false; await leaveAccount(); showToast("This device is disconnected"); }
    else { pendingAccountOut = true; }
  }
  else if (data.action === "backup" || data.action === "copy") {
    const text = data.action === "backup" ? backupText() : items.filter(isLow).map(function (item) {
      return item.name + ": order " + orderQty(item) + " " + item.unit + " (have " + item.count + ")";
    }).join("\n");
    navigator.clipboard.writeText(text).then(
      function () { showToast(data.action === "backup" ? "Backup copied. Paste it somewhere safe." : "Reorder list copied"); },
      function () { showToast("Copying is not allowed in this window"); }
    );
    return;
  }
  else if (target.type === "submit") { return; }   // the form's own submit handler takes it from here
  render();
});

// Every form on the page saves through here.
app.addEventListener("submit", async function (event) {
  event.preventDefault();
  if (busy) return;                 // ignore a second tap while the first is still saving
  busy = true;
  const id = event.target.id;
  if (id === "auth-form") { authError = ""; render(); authError = await submitAccount(); }
  else if (id === "setup-form") setupError = await createFirstManager();
  else if (id === "staff-form") staffError = await saveStaffFromDraft();
  else if (id === "item-form") formError = await saveItemFromDraft();
  busy = false;
  render();
});

// Remember what is typed in a form, so a redraw does not wipe it.
app.addEventListener("input", function (event) {
  const d = event.target.dataset;
  if (d.draft) draft[d.draft] = event.target.value;
  if (d.setup) setupDraft[d.setup] = event.target.value;
  if (d.auth) authDraft[d.auth] = event.target.value;
  if (d.sdraft) {
    staffDraft[d.sdraft] = event.target.value;
    if (d.sdraft === "role") render();          // the Team box only shows for employees
  }
});

// Typed counts and the business name: fire when the person leaves the box or presses Enter.
app.addEventListener("change", function (event) {
  if (event.target.classList.contains("count")) {
    setCount(Number(event.target.dataset.id), parseInt(event.target.value, 10));
    render();
  } else if (event.target.id === "business-name") {
    saveBusinessName(event.target.value.trim()).then(render);
  }
});

// Select the whole number when a count box is tapped, so typing replaces it.
app.addEventListener("focusin", function (event) {
  if (event.target.classList.contains("count")) event.target.select();
});

// Let a keyboard type the PIN too.
document.addEventListener("keydown", function (event) {
  if (phase !== "ready" || staff.length === 0 || currentUser !== null) return;   // only on the PIN screen
  if (event.key >= "0" && event.key <= "9" && event.key.length === 1) { pressPinKey(event.key); render(); }
  else if (event.key === "Backspace") { pinEntry = pinEntry.slice(0, -1); render(); }
});

// Shared tablet safety: back to the PIN screen after a few minutes with no taps or typing.
let idleTimer = null;
function restartIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () {
    if (currentUser !== null) { signOut(); render(); }
  }, IDLE_MINUTES * 60 * 1000);
}
document.addEventListener("click", restartIdleTimer);
document.addEventListener("keydown", restartIdleTimer);

// Keep in step with other devices even if a live update is missed.
setInterval(function () { if (phase === "ready") scheduleRefresh(0); }, REFRESH_SECONDS * 1000);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && phase === "ready") scheduleRefresh(0);
  if (document.visibilityState === "hidden") flushAllCounts();      // save taps before the tablet sleeps
});

/* ---------- START ---------- */
async function start() {
  if (!configured) { phase = "config"; render(); return; }
  if (!window.supabase || !window.supabase.createClient) {
    phase = "error";
    loadError = "The database library did not load. Check the internet connection and reload.";
    render();
    return;
  }
  if (db === null) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    db.auth.onAuthStateChange(function (eventName) {
      // The account was signed out somewhere else, or the session ended.
      if (eventName === "SIGNED_OUT" && phase === "ready") { stopListening(); signOut(); phase = "auth"; render(); }
    });
  }
  phase = "loading";
  render();
  try {
    const result = await db.auth.getSession();
    if (result.data && result.data.session) { await enterAccount(result.data.session.user); return; }
  } catch (error) { /* fall through to the sign-in screen */ }
  phase = "auth";
  render();
}
start();
restartIdleTimer();

/* ---------- INSTALLABLE APP ---------- */
// Registers sw.js, which keeps a copy of the app's own files so it opens quickly.
// The data itself always comes from the database, so counting needs an internet connection.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () { /* the app works without it */ });
}
</script>
